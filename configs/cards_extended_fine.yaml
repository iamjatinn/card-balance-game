# cards_extended.yaml at doubled resolution (HP, damage, heal, shield, combo x2) so the balance search
# can move in finer steps. Poison counters are unchanged (they fade by 1 a turn and cannot simply be doubled),
# so this is a slightly different game from cards_extended.yaml: poison is relatively weaker here.
rules:
  max_hp: 40
  max_mana: 5
  max_turns: 40
  max_shield: 12
  start_hand: 3
  max_hand: 6
  draw_per_turn: 1
  second_player_extra_cards: 0
  deck_size: 0
  fatigue_damage: 1
cards:
  strike:
    cost: 1
    damage: 6
  fireball:
    cost: 3
    damage: 14
  heal:
    cost: 2
    heal: 8
  shield:
    cost: 1
    shield: 6
  drain:
    cost: 3
    damage: 6
    heal: 6
  insight:
    cost: 2
    draw: 2
  venom:
    cost: 2
    poison: 3
  flurry:
    cost: 1
    damage: 4
    combo: 6
