name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you start a run by hand from the Actions tab

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # No PyTorch here: the PPO tests skip themselves when it is missing.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest numpy pandas gymnasium pygame pillow matplotlib
          pip install -e .
      - name: Run tests
        run: python -m pytest -q
